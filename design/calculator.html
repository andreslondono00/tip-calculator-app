<body>

  <div class="logo">
    <img src="../images/logo.svg" alt="" />
  </div>

  <div class="container">

    <div class="container_one">

      </form>

      <div class="bill">
        <label>Bill</label>
        <input class="amount" placeholder="0" type="text">
      </div>

      <label for="bill" class="select_tip">Select Tip %</label>

      <div class="percents">
        <button>5%</button>
        <button>10%</button>
        <button>15%</button>
        <button>25%</button>
        <button>50%</button>
        <button class="custom">Custom</button>
      </div>

      <div class="number_of_people">
        <label for="number_of_people">Number of People</label>
        <input class="people" placeholder="0" type="text">

      </div>

    </div>

    <div class="container_two">

      <div class="t_a_p_p">
        <div class="test">
          <label class="tip_amount">Tip Amount</label>
          <label class="per_person">/ person</label>
        </div>
        <span>0.00</span>
      </div>

      <div class="t_p_p">
        <label class="total">Total</label>
        <label class="per_person">/ person</label>
        <span>0.00</span>
      </div>

      <button class="reset">RESET</button>
    </div>

  </div>

  <div class="attribution">
