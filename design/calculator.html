<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
  <title>Frontend Mentor | Tip calculator app</title>
</head>

<body>

  <div class="logo">
    <img src="../images/logo.svg" alt="" />
  </div>

  <div class="container">

    <div class="container_one">

      </form>

      <div class="bill">
        <label>Bill</label>
        <input type="number" class="amount" placeholder="0" min="0" />
      </div>

      <label for="bill" class="select_tip">Select Tip %</label>

      <div class="percents">
        <button id="5_percent">5%</button>
        <button id="10_percent">10%</button>
        <button id="15_percent">15%</button>
        <button id="25_percent">25%</button>
        <button id="50_percent">50%</button>
        <input type="number" class="custom" placeholder="Custom" min="0" max="100" />
      </div>

      <div class="number_of_people">
        <div class="cant_be_zero_error">
          <label for="number_of_people">Number of People</label>
          <label for="cant_be_zero" class="cant_be_zero">Can't be zero</label>
        </div>
        <input type="number" class="people" placeholder="0" min="0" />

      </div>

    </div>

    <div class="container_two">

      <div class="tip_container">
        <div class="text">
          <label class="tip_amount_per_person">Tip Amount</label>
          <label class="per_person">/ person</label>
        </div>
        <div class="tip">
          <span>$</span>
          <span id="tip_amount">0.00</span>
        </div>
      </div>

      <div class="tip_container">
        <div class="text">
          <label class="tip_amount_per_person">Total</label>
          <label class="per_person">/ person</label>
        </div>
        <div class="tip">
          <span>$</span>
          <span id="total">0.00</span>
        </div>
      </div>

      <button id="reset" class="reset" onclick="onResetClick()">RESET</button>
    </div>

  </div>

  <div class="attribution">
    Challenge by
    <a href="https://www.frontendmentor.io/challenges/tip-calculator-app-ugJNGbJUX" target="_blank">Frontend Mentor</a>
    Coded by
    <a href="https://github.com/andreslondono00/tip-calculator-app">Andrés Londoño</a>
  </div>
  <script type="text/javascript" src="./js/calculator.js"></script>
</body>

</html>
